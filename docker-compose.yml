version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: insight-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: insight-frontend
    ports:
      - "8501:8501"
    environment:
      - INSIGHT_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
